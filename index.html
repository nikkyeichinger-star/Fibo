<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibo, Structure without the pressure.</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="logo.svg">
</head>
<body>

    <header class="app-header">
        <img src="logo.svg" alt="" class="logo-img"> Fibo
    </header>

    <main class="stage">

        <!-- Screen 1: brain dump. User writes down a task, or one tiny step per line. -->
        <section id="dump-view" class="view">
            <h1>What's spinning in your head?</h1>
            <p class="hint">Write it down. Or break it into tiny steps right away — one per line.</p>
            <textarea id="dump-input" rows="5" aria-label="Brain dump" placeholder="e.g.&#10;Sort the laundry&#10;Put it in the machine&#10;Add detergent"></textarea>
            <button id="start-btn" class="btn-primary">Start with this one thing</button>
        </section>

        <!-- Screen 2: one step at a time. Hidden until "Start" is clicked. -->
        <section id="step-view" class="view hidden">
            <ul class="progress" id="progress-dots" aria-hidden="true"></ul> <!-- filled in by JS: one dot per step -->
            <p class="step-label" id="step-label">Step 1 of 3</p> <!-- placeholder text, JS overwrites it -->
            <article class="step-card" id="step-card">
                <p class="skip-note" id="skip-note"></p>
                <p id="step-text">…</p> <!-- current step's text, set by JS -->
            </article>
            <p class="step-actions">
                <button id="done-btn" class="btn-primary">Done ✓</button>
                <button id="skip-btn" class="btn-ghost">Skip →</button>
            </p>
        </section>

        <!-- Screen 3: calm celebration after the last step. Hidden until all steps are done. -->
        <section id="celebrate-view" class="view hidden">
            <!-- the soft pulsing glow behind the message is pure CSS (::before on #celebrate-view), no confetti -->
            <h1 id="celebrate-msg">Nicely done 🌿</h1> <!-- JS swaps this for a random message -->
            <p class="hint">Nothing to do, for a moment.</p>
            <button id="again-btn" class="btn-primary">One more thing</button>
        </section>

    </main>

<script src="index.js"></script>
</body>
</html>
